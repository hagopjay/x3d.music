<title>Loomsong Preview</title>
<style>
  :root { --ink: #f4efe2; --dim: #b9b2a3; --gold: #e6b84a; --card: rgba(10, 10, 20, 0.66); --edge: rgba(244, 239, 226, 0.18); }
  html, body { background: #000; margin: 0; height: 100%; overflow: hidden; }
  #ls-root { position: fixed; inset: 0; background: #000; color: var(--ink); font: 14px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #ls-stage { position: absolute; inset: 0; }
  x3d-canvas.ls-canvas { display: block; width: 100%; height: 100%; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .ls-splash { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; background: radial-gradient(ellipse at center, rgba(8, 8, 20, 0.55), rgba(0, 0, 0, 0.92)); z-index: 5; }
  .ls-title { margin: 0; font-size: clamp(36px, 8vw, 84px); font-weight: 300; letter-spacing: 0.18em; text-transform: uppercase; }
  .ls-piece { margin: 0; font-size: clamp(16px, 2.6vw, 24px); color: var(--gold); }
  .ls-note, .ls-small { margin: 0; color: var(--dim); max-width: 34em; }
  .ls-big { margin-top: 8px; padding: 12px 44px; font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--gold); color: #1a1408; border: 0; border-radius: 999px; }
  .ls-big:disabled { opacity: 0.4; cursor: default; }

  .ls-corner { position: absolute; z-index: 4; width: min(430px, calc(100vw - 24px)); box-sizing: border-box; padding: 10px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--edge); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ls-corner[data-corner="bl"] { left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
  .ls-corner[data-corner="br"] { right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); }
  .ls-corner[data-corner="tl"] { left: 12px; top: max(12px, env(safe-area-inset-top)); }
  .ls-corner[data-corner="tr"] { right: 12px; top: max(12px, env(safe-area-inset-top)); }
  .ls-row { display: flex; align-items: center; gap: 10px; }
  .ls-tt { flex: 1; min-width: 0; }
  .ls-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ls-where { color: var(--dim); font-variant-numeric: tabular-nums; }
  .ls-section { margin: 6px 0 2px; color: var(--dim); font-size: 12.5px; }
  .ls-btn { min-height: 40px; padding: 0 14px; background: transparent; border: 1px solid var(--edge); border-radius: 8px; }
  .ls-play { min-width: 44px; padding: 0; font-size: 16px; background: var(--gold); color: #1a1408; border-color: transparent; border-radius: 50%; width: 44px; height: 44px; }
  .ls-bar { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
  .ls-range { flex: 1; height: 22px; accent-color: var(--gold); }
  .ls-time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .ls-keys { flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ls-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 10px; background: transparent; border: 1px solid var(--edge); border-radius: 999px; font-size: 12.5px; }
  .ls-chip kbd { font: inherit; font-size: 11px; color: var(--gold); border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px; }
  .ls-ai { margin-top: 6px; font-size: 12px; color: var(--dim); }

  .ls-compass { position: absolute; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: 12px; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--edge); }
  #ls-root[data-corner="tl"] .ls-compass { top: auto; bottom: 12px; }
  .ls-chord { font-size: 16px; font-weight: 600; }
  .ls-key { color: var(--dim); font-size: 12.5px; }
  .ls-lyric { position: absolute; z-index: 3; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom)); width: min(760px, calc(100vw - 48px)); text-align: center; text-shadow: 0 1px 6px #000, 0 0 2px #000; pointer-events: none; }
  .ls-de { font-size: clamp(16px, 2.4vw, 24px); }
  .ls-en { font-size: clamp(13px, 1.8vw, 17px); color: var(--dim); font-style: italic; }
  #ls-root[data-corner="bl"] .ls-lyric, #ls-root[data-corner="br"] .ls-lyric { bottom: auto; top: max(14px, env(safe-area-inset-top)); }
  .ls-tip { position: absolute; z-index: 6; max-width: 250px; padding: 8px 10px; border-radius: 10px; background: rgba(10, 10, 20, 0.86); border: 1px solid var(--edge); pointer-events: none; opacity: 0; transition: opacity 0.12s; }
  .ls-tip[data-show="1"] { opacity: 1; }
  .ls-tip-what { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; }
  .ls-tip-1 { font-weight: 600; font-size: 15px; }
  .ls-tip-2, .ls-tip-3 { color: var(--dim); font-size: 12px; word-break: break-all; }

  .ls-credits { position: absolute; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; padding: 24px; background: rgba(0, 0, 0, 0.78); }
  .ls-credits[data-show="1"] { display: flex; }
  .ls-credits h2 { margin: 0 0 8px; font-weight: 300; font-size: clamp(24px, 4vw, 44px); letter-spacing: 0.12em; text-transform: uppercase; }
  .ls-credbody { max-width: 40em; color: var(--dim); }
  .ls-credbody p { margin: 4px 0; }

  /* cards: the animated pictures (page/cards.js). A card is a muted video over its poster with a scrim that keeps the words readable; it takes no pointer events. */
  .ls-card { position: absolute; inset: 0; overflow: hidden; background: #000; pointer-events: none; z-index: -1; }
  .ls-card-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .ls-card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(4, 4, 14, 0.30), rgba(0, 0, 0, 0.72)); }
  .ls-credits[data-card="1"] { background: transparent; }
  .ls-credits[data-card="1"] .ls-card { background: #000; }
  .ls-credits[data-card="1"] .ls-card::after { background: rgba(0, 0, 0, 0.58); }
  .ls-card-open { position: absolute; inset: 0; z-index: 2; pointer-events: none; text-align: center; }
  .ls-card-open .ls-card { z-index: 0; }
  .ls-card-open .ls-card::after { background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.55)); }
  .ls-card-name { position: absolute; left: 0; right: 0; bottom: 20%; padding: 0 16px; font-size: clamp(30px, 7vw, 72px); font-weight: 300; letter-spacing: 0.16em; text-transform: uppercase; text-shadow: 0 2px 18px #000, 0 0 3px #000; }
  .ls-card-by { position: absolute; left: 0; right: 0; bottom: calc(20% - 2.2em); padding: 0 16px; color: var(--gold); font-size: clamp(14px, 2.4vw, 22px); letter-spacing: 0.08em; text-shadow: 0 1px 8px #000; }
  .ls-card-ai { position: absolute; right: max(14px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); max-width: 60vw; font-size: 12px; color: var(--dim); text-shadow: 0 1px 4px #000; text-align: right; }
  .ls-skip { position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); pointer-events: auto; background: var(--card); }
  .ls-splash-ai { margin: 0; font-size: 12px; color: var(--dim); max-width: 34em; }

  #ls-root[data-mode="none"] .ls-ui, #ls-root[data-mode="none"] .ls-lyric, #ls-root[data-mode="none"] .ls-tip { display: none; }
  #ls-root[data-mode="minimal"] .ls-compass, #ls-root[data-mode="minimal"] .ls-lyric, #ls-root[data-mode="minimal"] .ls-tip { display: none; }
  #ls-root[data-started="0"] .ls-ui, #ls-root[data-started="0"] .ls-lyric { display: none; }
  @media (prefers-reduced-motion: reduce) { .ls-tip { transition: none; } }
  @media (max-width: 520px) { .ls-btn { padding: 0 10px; } .ls-section { display: none; } }
</style>
<div id="ls-root" data-mode="minimal" data-corner="bl" data-playing="0" data-started="0"><div id="ls-stage"></div></div>
<script id="ls-cfg" type="application/json">{{CFG}}</script>
<script src="xite/x_ite.min.js"></script>
<script src="clock.js"></script>
<script src="driver.js"></script>
<script src="ui.js"></script>
<script src="cards.js"></script>
<script src="hover.js"></script>
<script src="report.js"></script>
<script src="boot.js"></script>
