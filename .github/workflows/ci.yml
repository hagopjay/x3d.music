name: ci

# Witnesses that run on every commit: the leak sweep and unit tests (sweep job); the Score witness and the score receipt (score job); the audio unit tests, the mutation spot-check, a fresh render of both masters and the Ear witness (audio job);
# Grammar, Meaning, Traps, Receipts and the browser probes (worlds job); the world generators' tests, the gate on both worlds and on their stand-ins without the generated pictures, Behaviour and Eyes on both sets, the Atlas witness, the page, hover, report and Cards tests (with test-pattern cards) and the Host witness (page job, after audio).
# The rest join as their phases land. Every checker is pinned in tools/pins.json; the pins are read from there, not repeated here.

# Pull requests are checked once (the merge result); main is checked after every merge. A branch push alone does not start a second, duplicate run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '1793491200'

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Leak sweep (keys, cloud paths, private links, vendor names, costs)
        run: python3 -I witnesses/leak_sweep.py --root .
      - name: Unit tests for the sweep and the trap rules (the Score witness's tests run in the score job, which has music21)
        run: python3 -I -m pytest -q witnesses --ignore=witnesses/test_score_check.py

  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-score.txt
      - name: Unit tests (kern reader, card library, spiral array, tracks) and the Score witness's damaged-card cases
        run: python3 -I -m pytest -q score witnesses/test_score_check.py
      - name: Receipts (a rebuild from the notated sources gives the same bytes)
        run: python3 -I witnesses/receipts.py check receipts/p1-scores.json
      - name: Score witness (composer notes equal the source, 0 missing and 0 extra; tracks equal a recomputation)
        run: python3 -I witnesses/score_check.py --out build/runs/score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-score-run
          path: build/runs
          retention-days: 14

  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LOOMSONG_CACHE: ${{ github.workspace }}/.cache/loomsong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ffmpeg (the Ear witness reads loudness and true peak a second time with it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - run: pip install -r requirements-audio.txt
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/loomsong/salamander
          key: salamander-${{ hashFiles('sources/salamander.manifest.json') }}
      - name: Fetch the piano samples (every file checked against sources/salamander.manifest.json)
        run: python3 -I tools/fetch_salamander.py
      - name: Unit tests (meters, limiter, sampler, routing, every voice and chain)
        run: python3 -I audio/test_audio.py
      - name: Mutation spot-check (eleven deliberate breakages of the audio code must each turn a test red)
        run: python3 -I audio/mutants.py
      - name: Render both masters from the score cards
        run: python3 -I audio/render.py all
      - name: Encode the masters for the page (AAC in .mp4, the form the host serves)
        run: python3 -I page/build_page.py --audio-only
      - uses: actions/upload-artifact@v4
        with:
          name: page-audio
          path: build/page/audio
          retention-days: 3
      - name: Ear witness (two loudness tools, true peak, range, phase, onsets against the card, stem sum, sub band, ring-out)
        run: python3 -I witnesses/ear.py --piece all --out build/runs/ear.json
      - name: The Ear witness's own tests (damaged masters must turn it red; the real piano stem is read now that it exists)
        run: python3 -I witnesses/test_ear.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-audio-run
          path: |
            build/runs
            build/audio/*/report.json
          retention-days: 14

  worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read the pins
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('tools/pins.json'))
          print('validator=' + p['validator']['commit'])
          print('gate=' + p['gate']['commit'])
          EOF
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d_mcp
          ref: ${{ steps.pins.outputs.validator }}
          path: .pins/x3d_mcp
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d.onto
          ref: ${{ steps.pins.outputs.gate }}
          path: .pins/x3d.onto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (the click-track fixtures need it; the runner image has none on its path)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Fetch the pinned X_ITE (sha512 checked)
        run: python3 -I tools/fetch_xite.py
      - name: Build the probe worlds
        run: python3 -I gen/probes/make_probes.py
      - name: Receipts (a rebuild gives the same sha256)
        run: python3 -I witnesses/receipts.py check receipts/p0-probes.json
      - name: Grammar, Meaning, Traps (pinned validator and gate, plus the five Loomsong rules)
        env:
          X3D_MCP: ${{ github.workspace }}/.pins/x3d_mcp
          LOOM_GATE: ${{ github.workspace }}/.pins/x3d.onto/gobbler-demiurge/tools
        run: python3 -I witnesses/gate_all.py build/probes --out build/runs/gate.json
      - name: Behaviour and Host probes (headless Chrome, software GL, strict policy copy)
        run: node witnesses/probes.mjs --strict --out build/runs/probes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-run
          path: build/runs
          retention-days: 14

  page:
    # P3: both worlds generated from the score cards, tested, validated, built into the page with the masters the audio job rendered, and played in headless Chrome under the strict policy copy.
    # The worlds are judged by what the witnesses find, not by their hashes (the generators use numpy, which may differ in the last bit on another CPU); the hashes are printed so a match can be seen.
    needs: audio
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read the pins
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('tools/pins.json'))
          print('validator=' + p['validator']['commit'])
          print('gate=' + p['gate']['commit'])
          EOF
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d_mcp
          ref: ${{ steps.pins.outputs.validator }}
          path: .pins/x3d_mcp
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d.onto
          ref: ${{ steps.pins.outputs.gate }}
          path: .pins/x3d.onto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fetch the pinned X_ITE (sha512 checked)
        run: python3 -I tools/fetch_xite.py
      - uses: actions/download-artifact@v4
        with:
          name: page-audio
          path: build/page/audio
      - name: Generate both worlds from the score cards
        run: |
          python3 -I gen/world_ode.py
          python3 -I gen/world_turca.py
          sha256sum build/worlds/ode.x3d build/worlds/turca.x3d
      - name: Generate the stand-in worlds too (LOOM_ART=procedural, the pictures drawn by code that every world keeps as its floor)
        run: |
          LOOM_ART=procedural python3 -I gen/world_ode.py --out build/worlds-standin
          LOOM_ART=procedural python3 -I gen/world_turca.py --out build/worlds-standin
      - name: Unit tests (meshes, shared world code, the Ode world, the Turca world, the picture and the art switch)
        run: python3 -I -m pytest -q gen
      - name: Grammar, Meaning, Traps on both worlds (pinned validator and gate, plus the five Loomsong rules)
        env:
          X3D_MCP: ${{ github.workspace }}/.pins/x3d_mcp
          LOOM_GATE: ${{ github.workspace }}/.pins/x3d.onto/gobbler-demiurge/tools
        run: python3 -I witnesses/gate_all.py build/worlds --out build/runs/gate.json
      - name: Grammar, Meaning, Traps on the stand-in worlds
        env:
          X3D_MCP: ${{ github.workspace }}/.pins/x3d_mcp
          LOOM_GATE: ${{ github.workspace }}/.pins/x3d.onto/gobbler-demiurge/tools
        run: python3 -I witnesses/gate_all.py build/worlds-standin --out build/runs/gate-standin.json
      - name: Install ffmpeg (it makes the test cards)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Make the test cards (four two-second test patterns standing in for the animated pictures, which are video and not in this repository)
        run: python3 -I tools/prep_cards.py --synthetic
      - name: Card media tests (a card holds nothing but pixels and our comment; the page ships only cards that match the manifest)
        run: python3 -I -m pytest -q witnesses/test_cards_media.py
      - name: Build the page (the worlds, the art, the cards, the tables, the scripts, X_ITE as the page's own files, the masters as .mp4)
        run: python3 -I page/build_page.py --no-audio
      - name: Behaviour, Ode (loads, shaders compile, every ROUTE fires and moves, the bus is exact)
        if: ${{ !cancelled() }}
        run: node witnesses/behaviour.mjs --world build/worlds/ode.x3d
      - name: Behaviour, Turca
        if: ${{ !cancelled() }}
        run: node witnesses/behaviour.mjs --world build/worlds/turca.x3d
      - name: Eyes, Ode (twelve stills, none black, none blown out)
        if: ${{ !cancelled() }}
        run: node witnesses/eyes.mjs --world build/worlds/ode.x3d --out build/stills/eyes-ode
      - name: Eyes, Turca
        if: ${{ !cancelled() }}
        run: node witnesses/eyes.mjs --world build/worlds/turca.x3d --out build/stills/eyes-turca
      - name: Behaviour, Ode stand-in (the picture drawn by code)
        if: ${{ !cancelled() }}
        run: node witnesses/behaviour.mjs --world build/worlds-standin/ode.x3d --out build/runs-standin
      - name: Behaviour, Turca stand-in (the dome's own tiles)
        if: ${{ !cancelled() }}
        run: node witnesses/behaviour.mjs --world build/worlds-standin/turca.x3d --out build/runs-standin
      - name: Eyes, Ode stand-in
        if: ${{ !cancelled() }}
        run: node witnesses/eyes.mjs --world build/worlds-standin/ode.x3d --out build/stills/eyes-ode-standin --runs build/runs-standin
      - name: Eyes, Turca stand-in
        if: ${{ !cancelled() }}
        run: node witnesses/eyes.mjs --world build/worlds-standin/turca.x3d --out build/stills/eyes-turca-standin --runs build/runs-standin
      - name: Atlas witness (each motif on the dome is the way up it is in the picture file; the dome still draws when the picture does not arrive)
        if: ${{ !cancelled() }}
        run: |
          python3 -I gen/probes/make_atlas_probe.py
          node witnesses/atlas_test.mjs
      - name: Page tests (modes, keys, seek by bar, the card's own arithmetic, the camera rig, the end card)
        if: ${{ !cancelled() }}
        run: node witnesses/page_test.mjs
      - name: Hover tests (the card names the note under the pointer, checked against the score card)
        if: ${{ !cancelled() }}
        run: node witnesses/hover_test.mjs
      - name: Report tests (the page's diagnostics are off without a store; with one, a small document, play and pause noticed, one write at a time)
        if: ${{ !cancelled() }}
        run: node witnesses/report_test.mjs
      - name: Cards tests (title, openings and the card between the pieces play over and behind the page, never in the music's timing; the page copes without the videos)
        if: ${{ !cancelled() }}
        run: node witnesses/cards_test.mjs
      - name: Host witness (both pieces start to end under the strict policy copy, 0 blocked requests, the real audio clock runs)
        if: ${{ !cancelled() }}
        run: node witnesses/host.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-worlds-run
          path: |
            build/runs
            build/runs-standin
            build/stills/eyes-ode
            build/stills/eyes-turca
            build/stills/eyes-ode-standin
            build/stills/eyes-turca-standin
            build/worlds/*.report.json
          retention-days: 14
