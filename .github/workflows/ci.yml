name: ci

# Witnesses that run on every commit: the leak sweep and unit tests (sweep job); the Score witness and the score receipt (score job); the audio unit tests, the mutation spot-check, a fresh render of both masters and the Ear witness (audio job);
# Grammar, Meaning, Traps, Receipts and the browser probes (worlds job). The rest join as their phases land. Every checker is pinned in tools/pins.json; the pins are read from there, not repeated here.

# Pull requests are checked once (the merge result); main is checked after every merge. A branch push alone does not start a second, duplicate run.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_DATE_EPOCH: '1793491200'

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Leak sweep (keys, cloud paths, private links, vendor names, costs)
        run: python3 -I witnesses/leak_sweep.py --root .
      - name: Unit tests for the sweep and the trap rules (the Score witness's tests run in the score job, which has music21)
        run: python3 -I -m pytest -q witnesses --ignore=witnesses/test_score_check.py

  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-score.txt
      - name: Unit tests (kern reader, card library, spiral array, tracks) and the Score witness's damaged-card cases
        run: python3 -I -m pytest -q score witnesses/test_score_check.py
      - name: Receipts (a rebuild from the notated sources gives the same bytes)
        run: python3 -I witnesses/receipts.py check receipts/p1-scores.json
      - name: Score witness (composer notes equal the source, 0 missing and 0 extra; tracks equal a recomputation)
        run: python3 -I witnesses/score_check.py --out build/runs/score.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-score-run
          path: build/runs
          retention-days: 14

  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      LOOMSONG_CACHE: ${{ github.workspace }}/.cache/loomsong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install ffmpeg (the Ear witness reads loudness and true peak a second time with it)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - run: pip install -r requirements-audio.txt
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/loomsong/salamander
          key: salamander-${{ hashFiles('sources/salamander.manifest.json') }}
      - name: Fetch the piano samples (every file checked against sources/salamander.manifest.json)
        run: python3 -I tools/fetch_salamander.py
      - name: Unit tests (meters, limiter, sampler, routing, every voice and chain)
        run: python3 -I audio/test_audio.py
      - name: Mutation spot-check (eleven deliberate breakages of the audio code must each turn a test red)
        run: python3 -I audio/mutants.py
      - name: Render both masters from the score cards
        run: python3 -I audio/render.py all
      - name: Ear witness (two loudness tools, true peak, range, phase, onsets against the card, stem sum, sub band, ring-out)
        run: python3 -I witnesses/ear.py --piece all --out build/runs/ear.json
      - name: The Ear witness's own tests (damaged masters must turn it red; the real piano stem is read now that it exists)
        run: python3 -I witnesses/test_ear.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-audio-run
          path: |
            build/runs
            build/audio/*/report.json
          retention-days: 14

  worlds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: pins
        name: Read the pins
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('tools/pins.json'))
          print('validator=' + p['validator']['commit'])
          print('gate=' + p['gate']['commit'])
          EOF
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d_mcp
          ref: ${{ steps.pins.outputs.validator }}
          path: .pins/x3d_mcp
      - uses: actions/checkout@v4
        with:
          repository: hagopjay/x3d.onto
          ref: ${{ steps.pins.outputs.gate }}
          path: .pins/x3d.onto
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (the click-track fixtures need it; the runner image has none on its path)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
      - name: Fetch the pinned X_ITE (sha512 checked)
        run: python3 -I tools/fetch_xite.py
      - name: Build the probe worlds
        run: python3 -I gen/probes/make_probes.py
      - name: Receipts (a rebuild gives the same sha256)
        run: python3 -I witnesses/receipts.py check receipts/p0-probes.json
      - name: Grammar, Meaning, Traps (pinned validator and gate, plus the five Loomsong rules)
        env:
          X3D_MCP: ${{ github.workspace }}/.pins/x3d_mcp
          LOOM_GATE: ${{ github.workspace }}/.pins/x3d.onto/gobbler-demiurge/tools
        run: python3 -I witnesses/gate_all.py build/probes --out build/runs/gate.json
      - name: Behaviour and Host probes (headless Chrome, software GL, strict policy copy)
        run: node witnesses/probes.mjs --strict --out build/runs/probes.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-run
          path: build/runs
          retention-days: 14
